syntax = "proto3";

// The gRPC ChunkStore wire contract (Milestone 2, proposal 0004). The storage
// data path is fragment-addressed (ADR-0019, M1): the client writes/reads each
// of a chunk's n erasure-coded fragments independently. This is an inter-component
// contract under versioned protobuf (ADR-0002) — evolved by addition, never a
// repurposed field.
package wyrd.v0;

// A 128-bit chunk id (ADR-0019), carried as high/low 64-bit halves because
// protobuf has no native 128-bit integer.
message ChunkId {
  fixed64 hi = 1;
  fixed64 lo = 2;
}

// A fragment's address: its chunk plus the fragment index within that chunk.
// Mirrors traits::FragmentId { chunk: ChunkId, index: u16 } — protobuf has no
// u16, so uint32 is the carrier (values stay in 0..n).
message FragmentId {
  ChunkId chunk = 1;
  uint32 index = 2;
}

message FragmentPutRequest {
  FragmentId id = 1;
  // The stored fragment bytes, exactly as specified by chunk-format (ADR-0019).
  bytes fragment = 2;
  // The write's authorization deadline (epoch milliseconds), enforced by the D
  // server itself against its own clock — proposal 0016 decision 5's `W_write`
  // (issue #638):
  // `docs/design/proposals/draft/0016-multipart-commit-protocol.md:1551-1576`. A
  // caller-side timeout alone bounds only how long the writer waits, not when an
  // already-accepted write takes effect, so the deadline travels with the write.
  // The server judges it at the last instant before it publishes — with the accept
  // queue, the thread-pool queue and the data write already behind it — and refuses
  // rather than queues, so a refused write leaves nothing stored, even across a
  // crash: nothing of it was ever published. It then re-reads its clock once the
  // publishing step has completed, and does NOT acknowledge a write it could not
  // verify was published inside the window; the two outcomes are distinguishable on
  // the wire, because they say different things about the bytes:
  //   FAILED_PRECONDITION — refused before publication: nothing landed, definitely.
  //   ABORTED             — the server could not verify the publication landed in
  //                         window: it may hold the bytes, in window or not, so the
  //                         caller must not count the write and must not record that
  //                         nothing landed either — it re-reads. It is deliberately
  //                         NOT reported as a definite late landing: a clock reading
  //                         taken after the publishing step dates the reading, so a
  //                         timely publication followed by a descheduled thread is
  //                         indistinguishable from one that overran.
  //                         (DEADLINE_EXCEEDED is deliberately not used for this
  //                         either: intermediaries and client channel deadlines
  //                         generate it, so it could not be told apart from an RPC
  //                         that never arrived.)
  //
  // **Additive and optional** (explicit proto3 presence, not zero-means-absent):
  // an absent field is today's unbounded behaviour, so every existing writer is
  // unaffected. Mixed-fleet caveat, stated honestly: an **old** D server ignores
  // this field, so a new client talking to one degrades to unenforced (no
  // capability exchange exists yet); a new server sees no field from an old client
  // and behaves exactly as before.
  optional uint64 deadline_millis = 3;
}

message FragmentPutResponse {}

message FragmentGetRequest {
  FragmentId id = 1;
}

message FragmentGetResponse {
  // Absent when no fragment is stored for the requested id — maps to the trait's
  // `Option<Bytes>` (explicit proto3 presence, not empty-means-absent).
  optional bytes fragment = 1;
}

// Walk what a D server holds (M3, proposal 0005): scrub enumerates a store's
// fragments to diff them against the chunk map. No request parameters — a store
// reports the whole set it holds.
message FragmentListRequest {}

message FragmentListResponse {
  // Every fragment id this store currently holds. Order is unspecified.
  repeated FragmentId ids = 1;
}

// Reclaim a fragment's bytes (M3, proposal 0005): GC deletes orphaned fragments.
message FragmentDeleteRequest {
  FragmentId id = 1;
}

// Empty: delete is idempotent, so an absent fragment is a successful no-op, not a
// distinct status.
message FragmentDeleteResponse {}

// Connection/discovery liveness, self-reported and trusted (ADR-0005). This is
// NOT durability telemetry or under-replication signalling (those are M3,
// ADR-0011). Mirrors traits::Health.
enum Health {
  HEALTH_HEALTHY = 0;
  HEALTH_DEGRADED = 1;
  HEALTH_UNHEALTHY = 2;
}

message HealthRequest {}

message HealthResponse {
  Health status = 1;
}

// The storage server's data-plane surface: deliberately dumb — fragment put/get
// plus liveness, no placement, no metadata, no identity (architecture §5 / §8.5).
service ChunkStore {
  rpc PutFragment(FragmentPutRequest) returns (FragmentPutResponse);
  rpc GetFragment(FragmentGetRequest) returns (FragmentGetResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
  // Added by addition for M3 maintenance (proposal 0005, ADR-0002 wire rule:
  // fields/rpcs never repurposed). The D server stays deliberately dumb (§8.5) —
  // it enumerates the bytes it holds and removes bytes it is told to.
  rpc ListFragments(FragmentListRequest) returns (FragmentListResponse);
  rpc DeleteFragment(FragmentDeleteRequest) returns (FragmentDeleteResponse);
}
