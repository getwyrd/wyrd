[package]
name = "wyrd-validate"
description = "The blackbox validator (proposal 0017): an out-of-process tool that drives a Wyrd deployment through its S3 front door the way a client does. The library carries the argument surface, the S3 client every scenario calls through, derived payloads and size classes; the binary still resolves its configuration, echoes it, and exits."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The pure decisions (argument parsing, credential resolution, the resolved-configuration
# echo) and the S3 client live in the library so the integration tests reach them directly;
# the binary is a thin shell over it that owns only the I/O (proposal 0017 §2 "Layering").
[lib]
path = "src/lib.rs"

[[bin]]
name = "wyrd-validate"
path = "src/main.rs"

# Third-party only, never `wyrd-*`: the no-`wyrd-*` closure of the normal graph is the
# blackbox property (proposal 0017 §9), enforced by `cargo xtask blackbox-guard`. The
# ADR-0003 §2 adoption audit for the AWS SDK sits by its pins in the root manifest.
[dependencies]
aws-sdk-s3.workspace = true
# The SDK's connector trait, which the client's own HTTP connector implements
# (`src/s3/wire.rs`).
aws-smithy-runtime-api.workspace = true
bytes.workspace = true
# `Stream`, the shape of a caller's PUT source.
futures-util.workspace = true
# `Body`/`Frame`, to hand a caller's source to the SDK as a request body with a declared
# length and no buffering, and to cap a response body the SDK buffers.
http-body.workspace = true
# The client's own HTTP connector (`src/s3/wire.rs`): hyper's HTTP/1.1 client connection over
# a tokio TCP socket, one per request, taken back after the response to see what followed it.
# Plain HTTP only, with TLS terminated in front of the gateway (proposal 0017 §10).
hyper.workspace = true
hyper-util.workspace = true
# The strict reading of an S3 error document (#853): well-formedness, the whole document and
# nothing after it but whitespace and comments, text-only fields, no DTD. The workspace's
# shared XML parser (ADR-0003 audit with #509), in place of the SDK's reader, which accepts a
# cut-off document.
roxmltree.workspace = true
# SHA-256: the counter-mode construction derived payloads are built from, and the payload
# digest checkpoints and the oracle key on (`src/payload.rs`; proposal 0017 §2, §4).
sha2.workspace = true
# The body-idle and body deadlines (`tokio::time::timeout`); the SDK's own deadlines sleep on
# the same runtime clock.
tokio.workspace = true

# Wyrd crates are allowed here and only here (proposal 0017 §9; the blackbox guard leaves
# dev-dependencies unconstrained): the client is proven against a real Wyrd S3 gateway served
# in-process on loopback, the composition `crates/server/tests/s3_http_wire.rs` uses.
[dev-dependencies]
tempfile.workspace = true
wyrd-chunkstore-fs.workspace = true
wyrd-coordination-mem.workspace = true
wyrd-core.workspace = true
wyrd-gateway-s3.workspace = true
wyrd-metadata-redb.workspace = true
wyrd-server = { path = "../server" }

# Inherit the workspace lint policy (single source of truth).
[lints]
workspace = true
