# Secret guard: blocks commits that would publish credentials.
# Activate once per clone:  pipx install pre-commit && pre-commit install
#
# Why: Claude Code saves approved shell commands verbatim (tokens included) to
# .claude/settings.local.json. .gitignore does not stop `git add -f`, a fresh clone
# without the global ignore, or a file created before the ignore rule existed.
repos:
  - repo: local
    hooks:
      - id: forbid-machine-local-files
        name: forbid machine-local files (Claude local settings, credentials)
        language: fail
        entry: "machine-local file, may hold recorded commands with secrets; never commit it (git restore --staged <path>)"
        files: '(^|/)(\.claude/settings\.local\.json|CLAUDE\.local\.md|\.credentials\.json|\.env)$'
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
