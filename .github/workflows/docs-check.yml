name: docs-check

# Validates the documentation on every pull request: lints the Markdown and
# renders the whole site with the internal-link audit (--check), WITHOUT
# deploying. This is the PR-time counterpart to docs.yml (which renders and
# publishes on push to main), so broken Markdown, dangling internal links, or
# unmarked normative specs are caught before merge instead of only at the
# post-merge publish step.
#
# No paths filter: the check always runs and reports a status, which is required
# for it to serve as a required status check (a path-filtered workflow would
# never report on PRs that don't touch docs/, blocking their merge).
#
# It also runs the two checkers in .github/docs-check/ (shared with eduralph/project-template):
# docs_links.py (every relative link points at a tracked file) and adr_index.py
# (docs/design/adr/README.md matches the ADRs' frontmatter).

on:
  pull_request:

permissions:
  contents: read

jobs:
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: the checks below read their checker from the PR's base commit.
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install renderer dependencies
        run: pip install "markdown-it-py[linkify]==3.0.0" "PyYAML==6.0.2"

      - name: Lint docs (Obsidian syntax + spec markers)
        run: python3 docs/publishing/tools/lint_docs.py

      - name: Render site (fails on any dangling internal link)
        run: python3 docs/publishing/tools/render_site.py --check --out ./build

      # The checkers' own tests, so a change to one is tested before it gates anything.
      - name: Test the checkers
        run: python3 -I -m unittest discover -s .github/docs-check -v
      # Each step runs the BASE commit's copy of its checker, so a PR cannot switch off
      # its own check by editing it. Only the PR that first adds a checker runs its own
      # copy. `-I` (isolated mode) keeps the checkout off sys.path, so a PR cannot plant
      # a module such as `re.py` that the checker would import instead of the stdlib.
      - name: Relative links resolve
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          CHECKER: .github/docs-check/docs_links.py
        run: |
          set -euo pipefail
          if git cat-file -e "$BASE:$CHECKER" 2>/dev/null; then
            echo "Running $CHECKER from the base commit $BASE"
            git show "$BASE:$CHECKER" | python3 -I -
          else
            echo "$CHECKER is not on the base; running the PR's copy"
            python3 -I "$CHECKER"
          fi
      - name: ADR index matches the ADRs
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          CHECKER: .github/docs-check/adr_index.py
        run: |
          set -euo pipefail
          if git cat-file -e "$BASE:$CHECKER" 2>/dev/null; then
            echo "Running $CHECKER from the base commit $BASE"
            git show "$BASE:$CHECKER" | python3 -I -
          else
            echo "$CHECKER is not on the base; running the PR's copy"
            python3 -I "$CHECKER"
          fi
