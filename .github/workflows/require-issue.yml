name: PR hygiene

# Enforce that every PR is tied to an issue. A required status check on `main`; with
# branch protection's `enforce_admins` the PR+issue process binds everyone, admins
# included.
#
# A PR satisfies the check when it is tied to an issue in either of two ways:
#   1. a linked/closing issue: a closing keyword in the description ("Closes #123",
#      "Fixes #123", "Resolves #123") or an issue linked via the PR's Development
#      sidebar. GitHub links a closing keyword only when the PR targets the default
#      branch, so for any other base the keyword is checked like a reference below;
#   2. a non-closing reference in the title or description ("Refs #123", "Ref: #123",
#      "Refs #123, #124", "Refs owner/repo#123"), for a PR that delivers part of an
#      issue and must not close it. Each referenced number is looked up and counts
#      only if it is an issue (not a PR) the workflow token can read. References
#      inside fenced code blocks or HTML comments are ignored.
# Editing the PR title or body re-runs the check. Linking an issue through the sidebar does
# not trigger a run: re-run the failed job afterwards.
#
# Dependabot's dependency-bump PRs pass without an issue: they are traceable through the
# changelog and the dependency audit. They pass rather than skip, because a skipped
# required check stays pending and would block the merge.

# The job keeps the name `require-issue`, which branch protection requires.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  require-issue:
    name: require-issue
    runs-on: ubuntu-latest
    steps:
      - name: Verify the PR links an issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;
            if (context.payload.pull_request.user.login === 'dependabot[bot]') {
              core.info('Dependency PR by dependabot — exempt.');
              return;
            }
            const query = `
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    title
                    body
                    closingIssuesReferences(first: 1) { totalCount }
                  }
                }
              }`;
            const res = await github.graphql(query, { owner, repo, number });
            const pr = res.repository.pullRequest;
            const linked = pr.closingIssuesReferences.totalCount;
            if (linked > 0) {
              core.info(`PR is linked to ${linked} issue(s) — OK.`);
              return;
            }

            // No closing link: look for `Refs #N` references in the title and body, and for closing
            // keywords, which GitHub links only when the PR targets the default branch.
            const text = `${pr.title || ''}\n${pr.body || ''}`
              .replace(/<!--[\s\S]*?-->/g, '')
              .replace(/^\s*(```|~~~)[\s\S]*?^\s*\1/gm, '');
            const REF = '(?:([\\w.-]+)\\/([\\w.-]+))?#(\\d+)';
            const keyword = new RegExp(
              `\\b(?:refs?|close[sd]?|fix(?:e[sd])?|resolve[sd]?)\\b:?\\s*(${REF}(?:\\s*(?:,|and)\\s*${REF})*)`, 'gi');
            const refs = [];
            for (const m of text.matchAll(keyword)) {
              for (const r of m[1].matchAll(new RegExp(REF, 'g'))) {
                refs.push({ owner: r[1] || owner, repo: r[2] || repo, number: Number(r[3]) });
              }
            }

            const kind = `
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  issueOrPullRequest(number: $number) { __typename }
                }
              }`;
            // Each distinct reference once, at most MAX_LOOKUPS of them, stopping at the first
            // real issue: a body repeating `#1` cannot spend the token's GraphQL quota.
            const MAX_LOOKUPS = 10;
            const seen = new Set();
            const unique = refs.filter((r) => {
              const key = `${r.owner}/${r.repo}#${r.number}`.toLowerCase();
              return !seen.has(key) && seen.add(key);
            }).slice(0, MAX_LOOKUPS);
            const issues = [];
            for (const r of unique) {
              const name = `${r.owner}/${r.repo}#${r.number}`;
              try {
                const k = await github.graphql(kind, r);
                const t = k.repository && k.repository.issueOrPullRequest &&
                          k.repository.issueOrPullRequest.__typename;
                if (t === 'Issue') {
                  issues.push(name);
                  break;
                } else {
                  core.info(`${name} is ${t ? 'a pull request' : 'not found'} — not counted.`);
                }
              } catch (e) {
                core.info(`${name} could not be read (${e.message}) — not counted.`);
              }
            }
            if (issues.length > 0) {
              core.info(`PR references ${issues.join(', ')} (non-closing) — OK.`);
              return;
            }
            core.setFailed(
              'This PR is not linked to an issue. Add a closing reference to the ' +
              'PR description (e.g. "Closes #123"), a non-closing one for partial ' +
              'work (e.g. "Refs #123"), or link an issue via the Development ' +
              'sidebar. Editing the title or description re-runs this check; after ' +
              'linking through the sidebar, re-run the failed job.'
            );
